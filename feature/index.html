<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Your Boardroom Moves feature | BoardRoom CXO</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/images/favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Manrope:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Open+Sans:wght@700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#F7F6F2;--bg-alt:#EAE8E1;--surface:#FFFFFF;--ink:#0F1110;--ink-2:#4A4D4A;--emerald:#1A362D;--emerald-2:#244A3D;--gold:#D4A860;--line:#D1CFCA;--bad:#9B2C1F;
--display:'Bodoni Moda','Times New Roman',serif;--body:'Manrope',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,monospace}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none!important}
.top{background:var(--emerald);color:var(--bg);padding:14px max(18px,env(safe-area-inset-right)) 14px max(18px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px}
.top b{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.01em}
.top span{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.bar{height:3px;background:var(--bg-alt)}.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .4s}
main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:clamp(28px,6vw,56px) max(18px,env(safe-area-inset-right)) 48px max(18px,env(safe-area-inset-left))}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin:0 0 14px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1;letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
h2{font-family:var(--display);font-weight:500;font-size:1.45rem;margin:0 0 8px}
p.lead{color:var(--ink-2);font-size:1.05rem;margin:0 0 26px;max-width:52ch}
label.f{display:block;margin:0 0 18px}
label.f>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
label.f small{display:block;color:var(--ink-2);font-size:12.5px;margin-top:5px}
input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:0;padding:13px 14px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--emerald);box-shadow:0 0 0 1px var(--emerald)}
textarea{min-height:150px;resize:vertical;line-height:1.55}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}
.btn{appearance:none;border:1px solid var(--emerald);background:var(--emerald);color:var(--bg);font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;padding:15px 24px;cursor:pointer;border-radius:0;display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.btn:hover{background:var(--emerald-2)}.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--ink)}
.link{background:none;border:0;padding:0;font:inherit;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.hint{font-size:12.5px;color:var(--ink-2)}
.err{background:#F6E4DF;border-left:3px solid var(--bad);color:var(--bad);padding:11px 14px;font-size:14px;margin:0 0 18px}
.pkgs{display:grid;gap:16px}
.plus{background:var(--emerald);color:var(--bg);padding:26px 22px 22px;position:relative;margin-top:10px}
.plus .badge{position:absolute;top:-11px;left:22px;background:var(--gold);color:var(--emerald);font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:4px 10px;font-weight:700}
.plus .pt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 4px}
.plus h3{font-family:var(--display);font-weight:500;font-size:1.9rem;margin:0}
.plus .pr{font-family:var(--mono);font-size:14px;color:var(--gold);white-space:nowrap}
.plus .tagline{color:#C9D3CD;margin:0 0 18px;font-size:14.5px}
.plus .grid{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:22px;align-items:start}
.plus ul{margin:0;padding:0;list-style:none;display:grid;gap:9px}
.plus li{padding-left:24px;position:relative;font-size:14.5px;line-height:1.45}
.plus li::before{content:'\2713';position:absolute;left:0;color:var(--gold);font-weight:700}
.plus figure{margin:0}.plus canvas{width:100%;height:auto;display:block;border:1px solid rgba(255,255,255,.15)}
.plus figcaption{font-size:11.5px;color:#C9D3CD;margin-top:6px;text-align:center}
.plus .btn{background:var(--gold);border-color:var(--gold);color:var(--emerald);margin-top:22px;font-weight:700}.plus .btn:hover{background:#E2BB78}
.plus .hint{color:#C9D3CD;margin:10px 0 0}
.freec{background:var(--surface);border:1px solid var(--line);padding:20px 22px}
.freec .pt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.freec h3{font-family:var(--display);font-weight:500;font-size:1.35rem;margin:0}.freec .pr{font-family:var(--mono);font-size:13px}
.freec p{color:var(--ink-2);font-size:14.5px;margin:0 0 14px}
.cmpw{overflow-x:auto;margin-top:32px}.cmpw h2{font-size:1.25rem;margin:0 0 10px}
.cmp{width:100%;min-width:460px;border-collapse:collapse;font-size:13.5px;background:var(--surface)}
.cmp th,.cmp td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.cmp th{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:400;color:var(--ink-2);background:var(--bg-alt)}
.cmp th.y{background:var(--emerald);color:var(--gold)}
.cmp td:first-child{font-weight:600;width:26%}.cmp td.y{background:#EEF2EF}.cmp .no{color:#A3A39E}
.lichk{background:var(--surface);border:1px solid var(--line);padding:14px 16px;margin:0 0 18px;font-size:14.5px}
.lichk b{display:block;font-size:13px;margin-bottom:4px}.lichk a{color:var(--emerald);word-break:break-all}
@media(max-width:560px){.plus .grid{grid-template-columns:1fr}.plus figure{max-width:240px}}
.pkg{display:block;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);padding:22px 22px 20px;cursor:pointer;font:inherit;color:inherit;border-radius:0;position:relative;transition:border-color .15s}
.pkg:hover{border-color:var(--ink)}.pkg.on{border-color:var(--emerald);box-shadow:inset 0 0 0 1px var(--emerald)}
.pkg .pt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.pkg h3{font-family:var(--display);font-weight:500;font-size:1.5rem;margin:0}
.pkg .pr{font-family:var(--mono);font-size:13px;white-space:nowrap}
.pkg ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.pkg li{padding-left:18px;position:relative;color:var(--ink-2);font-size:14.5px}
.pkg li::before{content:'—';position:absolute;left:0;color:var(--emerald)}
.photo{display:grid;grid-template-columns:120px 1fr;gap:18px;align-items:center;margin-bottom:8px}
.photo .ph{width:120px;height:120px;background:var(--bg-alt) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;text-align:center}
.drop{border:1px dashed var(--ink-2);padding:18px;text-align:center;cursor:pointer;background:var(--surface)}
.drop.busy{cursor:wait;border-style:solid;border-color:var(--emerald);background:#EEF2EF}
.ph.busy{position:relative}.ph.busy::after{content:'';position:absolute;inset:0;background:rgba(247,246,242,.55)}
.okline{color:var(--emerald);font-weight:600;font-size:14px;margin:6px 0 0}
.alt{background:var(--surface);border:1px solid var(--line);padding:16px 18px;margin-top:30px;font-size:14.5px}
.alt b{display:block;margin-bottom:4px}
.drop.over{border-color:var(--emerald);background:#EEF2EF}
.check{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);padding:16px;cursor:pointer;font-size:14.5px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--emerald);flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin-bottom:18px}
.seg button{font:inherit;font-size:14px;padding:12px;border:0;background:var(--surface);cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--emerald);color:var(--bg)}
.sum{background:var(--surface);border:1px solid var(--line);padding:18px 20px;margin:0 0 6px;font-size:14.5px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.sum div.t{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:700}
.tl{list-style:none;margin:28px 0 0;padding:0;border-left:1px solid var(--line)}
.tl li{position:relative;padding:0 0 18px 24px;color:var(--ink-2);font-size:14.5px}
.tl li::before{content:'';position:absolute;left:-6px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.tl li.done{color:var(--ink)}.tl li.done::before{background:var(--emerald);border-color:var(--emerald)}
.tl li.now{color:var(--ink);font-weight:600}.tl li.now::before{background:var(--gold);border-color:var(--gold)}
.rv{background:var(--surface);border:1px solid var(--line);margin:0 0 16px}
.rv h3{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:400;margin:0;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--ink-2)}
.rv pre{white-space:pre-wrap;word-wrap:break-word;font:inherit;font-size:15px;margin:0;padding:16px;max-height:420px;overflow:auto}
.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px}
.imgs figure{margin:0}.imgs img{width:100%;border:1px solid var(--line);display:block}.imgs figcaption{font-size:12px;color:var(--ink-2);margin-top:4px}
.links a{display:block;border:1px solid var(--line);background:var(--surface);padding:15px 18px;margin-bottom:10px;color:var(--ink);text-decoration:none;font-weight:600}
.links a:hover{border-color:var(--emerald)}
.qn{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--ink-2);margin-bottom:8px}
footer{font-size:12px;color:var(--ink-2);text-align:center;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
footer a{color:inherit}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fade{animation:fd .25s ease}@keyframes fd{from{transform:translateY(6px)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.fade{animation:none}}
@media(max-width:480px){.row2{grid-template-columns:1fr}.photo{grid-template-columns:96px 1fr}.photo .ph{width:96px;height:96px}}
</style>
</head>
<body>
<header class="top"><b>BoardRoom CXO</b><span>Boardroom Moves</span></header>
<div class="bar"><i id="bar"></i></div>
<main id="app" aria-live="polite"><p class="hint"><span class="spin"></span> Loading your feature…</p></main>
<footer>Questions? Reply to our message or write to <a href="mailto:hire@boardroomcxo.com">hire@boardroomcxo.com</a></footer>
<script>
(() => {
const token = new URLSearchParams(location.search).get('t') || '';
const API = '/api/moves/f/' + encodeURIComponent(token);
const app = document.getElementById('app'), bar = document.getElementById('bar');
let V = null, step = null, qi = 0, err = '', busy = false, photoUrl = '', draft = {}, uploading = false, justUploaded = false;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const first = n => String(n || '').trim().split(/\s+/)[0] || '';
const rs = n => 'Rs ' + Number(n || 0).toLocaleString('en-IN');
const niceDate = d => d ? new Date(d + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'UTC' }) : '';
const STATE_NAMES = { AN:'Andaman & Nicobar',AP:'Andhra Pradesh',AR:'Arunachal Pradesh',AS:'Assam',BR:'Bihar',CH:'Chandigarh',CT:'Chhattisgarh',DL:'Delhi',DN:'Dadra & Nagar Haveli and Daman & Diu',GA:'Goa',GJ:'Gujarat',HP:'Himachal Pradesh',HR:'Haryana',JH:'Jharkhand',JK:'Jammu & Kashmir',KA:'Karnataka',KL:'Kerala',LA:'Ladakh',LD:'Lakshadweep',MH:'Maharashtra',ML:'Meghalaya',MN:'Manipur',MP:'Madhya Pradesh',MZ:'Mizoram',NL:'Nagaland',OR:'Odisha',PB:'Punjab',PY:'Puducherry',RJ:'Rajasthan',SK:'Sikkim',TN:'Tamil Nadu',TR:'Tripura',TS:'Telangana',UK:'Uttarakhand',UP:'Uttar Pradesh',WB:'West Bengal' };

async function call(path, body, form) {
  const opt = body || form ? { method: 'POST' } : {};
  if (body) { opt.headers = { 'Content-Type': 'application/json' }; opt.body = JSON.stringify(body); }
  if (form) opt.body = form;
  const r = await fetch(API + (path ? '/' + path : ''), opt);
  const d = await r.json().catch(() => ({ error: 'Something went wrong. Please try again.' }));
  if (!r.ok) throw new Error(d.error || 'Something went wrong. Please try again.');
  return d;
}
async function act(path, body, form, nextStep) {
  if (busy) return; busy = true; err = ''; render();
  try { V = await call(path, body, form); if (nextStep !== undefined) step = nextStep; }
  catch (e) { err = e.message; }
  busy = false; render();
}

// Which screens this person still needs, in order.
function flow() {
  const s = [];
  if (!V.pack_buyer) {
    s.push('welcome');
    if (!V.locked_tier && !V.paid) s.push('package');
    s.push('details', 'contact', 'photo');
    if (V.tier && V.tier !== 'free') s.push('questions');
    s.push('consent');
    if (V.tier === 'plus' && !V.paid) s.push('billing', 'pay');
  } else if (!V.paid) s.push('packwelcome', 'billing', 'pay');
  return s;
}
const inWizard = () => ['invited', 'details', 'payment'].includes(V.status) || (V.pack_buyer && !V.paid);
function firstOpen() {
  const d = V.details || {};
  if (V.pack_buyer) return V.payer_type ? 'pay' : 'packwelcome';
  if (V.status === 'invited' && !V.tier) return 'welcome';
  if (!V.tier) return 'package';
  if (!(d.name && d.role_title && d.company)) return 'details';
  if (!V.email || !V.phone) return 'contact';
  if (!V.has_photo) return 'photo';
  if (V.tier !== 'free' && !V.skip_questions && !d.source_link && (d.answers || []).filter(a => String(a || '').trim()).length < 3) return 'questions';
  if (!V.consent) return 'consent';
  if (V.tier === 'plus' && !V.paid) return V.payer_type ? 'pay' : 'billing';
  return null;
}
function go(dir) {
  const f = flow(), i = f.indexOf(step);
  step = f[Math.max(0, Math.min(f.length - 1, i + dir))]; err = ''; qi = 0; render(); scrollTo(0, 0);
}

function render() {
  if (!V) return;
  if (inWizard() && !step) step = firstOpen() || 'done';
  if (!inWizard()) step = null;
  const f = flow(), i = f.indexOf(step);
  bar.style.width = inWizard() ? Math.round(((i < 0 ? f.length : i) + 1) / (f.length + 1) * 100) + '%' : '100%';
  const E = err ? `<div class="err" role="alert">${esc(err)}</div>` : '';
  const html = inWizard() ? (SCREENS[step] || SCREENS.done)() : STATUS();
  app.innerHTML = `<div class="fade">${html.replace('%ERR%', E)}</div>`;
  bind();
}
const back = () => `<button type="button" class="link" data-go="-1">Back</button>`;
const btn = (label, attr) => `<button type="submit" class="btn" ${busy ? 'disabled' : ''} ${attr || ''}>${busy ? '<span class="spin"></span>' : ''}${esc(label)}</button>`;

const SCREENS = {
  welcome: () => `<p class="kicker">Boardroom Moves</p><h1>Congratulations${V.name ? ', ' + esc(first(V.name)) : ''}.</h1>
    <p class="lead">${V.role_title || V.company ? `Your move to <strong>${esc([V.role_title, V.company].filter(Boolean).join(' at '))}</strong> deserves to be seen. ` : ''}This takes about five minutes: ${V.locked_tier ? 'confirm your details, add a photo' : 'choose how you would like your move carried, confirm your details, add a photo'}, and you approve everything before it goes live.</p>
    ${V.tier === 'pick' ? `<p class="lead">You have been chosen as an <strong>Editorial pick</strong>: a dedicated feature on us.</p>` : ''}
    ${V.tier === 'pack' ? `<p class="lead">Your company has arranged a <strong>dedicated feature</strong> for you.</p>` : ''}
    <form data-f="next"><div class="actions">${btn('Start')}</div></form>`,
  package: () => {
    const plus = V.packages.find(p => p.tier === 'plus'), free = V.packages.find(p => p.tier === 'free');
    if (!plus) return `<p class="kicker">Step 1 · Your feature</p><h1>Your feature</h1>%ERR%<div class="freec"><div class="pt"><h3>${esc(free.title)}</h3><span class="pr">Free</span></div><p>${free.includes.map(esc).join('. ')}.</p><button type="button" class="btn" data-tier="free">Continue</button></div><div class="actions">${back()}</div>`;
    const no = '<span class="no">—</span>';
    const rows = [
      ['On LinkedIn', 'One line in a shared Friday post, alongside other moves', 'Your own post, Tuesday or Thursday at 6 pm, with you and your company tagged'],
      ['Your post image', no, 'A designed Boardroom Moves image with your photo, name and role'],
      ['On boardroomcxo.com', 'A short note on the Boardroom Moves page', 'A profile page under your name, written from your answers'],
      ['Instagram', no, 'A post on the BoardRoom CXO Instagram'],
      ['WhatsApp community', no, `Shared with our community of ${esc(V.community || '100+ CXOs')}`],
      ['Invoice', no, 'GST invoice to you or your company'],
      ['Your approval', 'Yes, before it goes live', 'Yes, before anything goes live']];
    return `<p class="kicker">Step 1 · Your feature</p><h1>How would you like your move carried?</h1>%ERR%
    <div class="pkgs">
      <section class="plus"><span class="badge">Recommended</span>
        <div class="pt"><h3>Plus</h3><span class="pr">${rs(plus.price)} + GST</span></div>
        <p class="tagline">Your own feature, not a line in a list.</p>
        <div class="grid"><ul>${plus.includes.filter(x => !/approve/i.test(x)).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
          <figure><canvas id="mini" width="1080" height="1080" aria-label="Preview of your Boardroom Moves post"></canvas><figcaption>How your post looks, with your photo</figcaption></figure></div>
        <button type="button" class="btn" data-tier="plus">Choose Plus · ${rs(plus.total)}</button>
        <p class="hint">${rs(plus.total)} including GST. You approve everything before it goes live.</p>
      </section>
      <section class="freec"><div class="pt"><h3>${esc(free.title)}</h3><span class="pr">Free</span></div>
        <p>One line about your move in our Friday round-up post on LinkedIn, and a short note on boardroomcxo.com. You approve it first.</p>
        <button type="button" class="btn ghost" data-tier="free">Continue with the free option</button></section>
    </div>
    <div class="cmpw"><h2>What is the difference?</h2><table class="cmp"><thead><tr><th></th><th>Free</th><th class="y">Plus</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="y">${r[2]}</td></tr>`).join('')}</tbody></table></div>
    <div class="actions">${back()}</div>`; },
  details: () => { const d = V.details || {}; return `<p class="kicker">Your move</p><h1>Is this right?</h1><p class="lead">We use these exact words in your post.</p>%ERR%
    <form data-f="details"><label class="f"><span>Your full name</span><input type="text" name="name" value="${esc(d.name || V.name)}" required autocomplete="name"></label>
    <label class="f"><span>New role title</span><input type="text" name="role_title" value="${esc(d.role_title || V.role_title)}" required placeholder="e.g. Chief Marketing Officer"></label>
    <label class="f"><span>Company</span><input type="text" name="company" value="${esc(d.company || V.company)}" required></label>
    <div class="row2"><label class="f"><span>Start date</span><input type="date" name="start_date" value="${esc(d.start_date || '')}"></label>
    <label class="f"><span>City</span><input type="text" name="city" value="${esc(d.city || '')}" placeholder="e.g. Mumbai"></label></div>
    <label class="f"><span>Previous role <em style="font-weight:400;color:var(--ink-2)">(optional)</em></span><input type="text" name="prev_role" value="${esc(d.prev_role || '')}" placeholder="e.g. VP Marketing, Tanishq"><small>Mentioned in the post if you add it.</small></label>
    ${d.linkedin && !draft.editLi ? `<div class="lichk"><b>We tag this LinkedIn profile</b><a href="${esc(d.linkedin)}" target="_blank" rel="noopener">${esc(d.linkedin.replace(/^https:\/\/(www\.)?/, ''))}</a> · <button type="button" class="link" data-editli>Not you? Change it</button><input type="hidden" name="linkedin" value="${esc(d.linkedin)}"></div>`

    drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');

// A preview of their Plus post in the Boardroom Moves template, with a placeholder where their photo goes.
let LOGO = null;
async function drawMini(cv) {
  const g = cv.getContext('2d'), W = 1080, H = 1080, d = V.details || {};
  const name = d.name || V.name || 'Your name', role = d.role_title || V.role_title || 'your new role', company = d.company || V.company || 'your company';
  try { await document.fonts.load('800 44px "Open Sans"'); await document.fonts.load('700 25px "Open Sans"'); } catch (e) {}
  if (!LOGO) { LOGO = new Image(); LOGO.src = '/images/logo-boardroomcxo.png'; await new Promise(ok => { LOGO.onload = ok; LOGO.onerror = ok; }); }
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, '#6A7570'); bg.addColorStop(1, '#2B3330'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = 'rgba(255,255,255,0.16)'; g.beginPath(); g.arc(W / 2, 420, 165, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.ellipse(W / 2, 1010, 370, 360, 0, Math.PI, 0); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.8)'; g.font = '700 34px "Open Sans", sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('Your photo', W / 2, 420); g.textAlign = 'left';
  const gr = g.createLinearGradient(0, H * 0.55, 0, H); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.55, 'rgba(0,0,0,0.72)'); gr.addColorStop(1, 'rgba(0,0,0,0.92)'); g.fillStyle = gr; g.fillRect(0, H * 0.55, W, H * 0.45);
  g.font = '700 25px "Open Sans", sans-serif'; const lab = 'Boardroom Moves', lw = g.measureText(lab).width;
  g.fillStyle = 'rgba(30,30,30,0.62)'; g.fillRect(0, 48, 40 + lw + 150, 52); g.fillStyle = '#fff'; g.fillText(lab, 40, 75);
  if (LOGO && LOGO.naturalWidth) g.drawImage(LOGO, W - 214, 48, 158, 158);
  g.font = '800 44px "Open Sans", sans-serif'; g.textBaseline = 'alphabetic';
  const words = [].concat(...[[name, '#FFD84D'], ['appointed as ' + role + ' at', '#fff'], [company, '#FFD84D']].map(([t, c]) => String(t).split(/\s+/).filter(Boolean).map(w => [w, c])));
  const sp = g.measureText(' ').width, lines = []; let cur = [], cw = 0;
  for (const [w, c] of words) { const ww = g.measureText(w).width; if (cur.length && cw + sp + ww > W - 90) { lines.push([cur, cw]); cur = []; cw = 0; } cw += (cur.length ? sp : 0) + ww; cur.push([w, c, ww]); }
  if (cur.length) lines.push([cur, cw]);
  let y = H - 52 - (lines.length - 1) * 54;
  for (const [ws, w] of lines) { let x = (W - w) / 2; for (const [t, c, tw] of ws) { g.fillStyle = c; g.fillText(t, x, y); x += tw + sp; } y += 54; }
}
function saveAnswer() {
  const t = app.querySelector('textarea[name=a]'); if (!t) return;
  draft.answers = (draft.answers || (V.details.answers || []).slice()); draft.answers[qi] = t.value;

async function upload(f) {
  if (!/^image\/(jpeg|png|webp)$/.test(f.type)) { err = 'Use a JPG, PNG or WebP photo.'; return render(); }
  if (f.size > 25 * 1024 * 1024) { err = 'That photo is over 25 MB. Use a smaller one.'; return render(); }
  photoUrl = URL.createObjectURL(f); uploading = true; justUploaded = false; err = ''; render();
  try {
    const fd = new FormData(); fd.append('photo', await shrink(f), 'photo.jpg');
    V = await call('photo', null, fd); justUploaded = true;
  } catch (e) { err = e.message || 'The photo did not upload. Check your connection and try again.'; }
  uploading = false; render();
}
// Phone photos are often 4 to 8 MB: scale to 1800 px on the long side before sending, so the upload takes a second or two.
function shrink(f) {
  return new Promise(ok => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
      if (k === 1 && f.size < 1.5 * 1024 * 1024) return ok(f);
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => ok(b && b.size < f.size ? b : f), 'image/jpeg', 0.88);
    };
    img.onerror = () => ok(f);
    img.src = photoUrl;
  });
}
async function submit(kind, v) {
  if (kind === 'next') return go(1);
  if (kind === 'details') return act('details', v, null, 'contact');
  if (kind === 'contact') {
    if (String(v.phone).replace(/\D/g, '').length < 10) { err = 'Enter your full WhatsApp number. We send your draft there for approval.'; return render(); }
    return act('details', v, null, 'photo');
  }
  if (kind === 'photo') { if (uploading || !V.has_photo) return; justUploaded = false; return go(1); }
  if (kind === 'source') { const r = await act('details', { source_link: v.source_link, source_note: v.source_note, skip_questions: false }, null, undefined); if (!err) { draft.linkMode = false; step = 'consent'; render(); } return r; }
  if (kind === 'answer') {
    saveAnswer();
    if (qi < V.questions.length - 1) { qi++; err = ''; render(); return; }
    const filled = draft.answers.filter(a => String(a || '').trim()).length;
    if (filled < 3) { err = `Answer at least three questions (you have ${filled}), or skip them all below.`; return render(); }
    return act('details', { answers: draft.answers, skip_questions: false }, null, 'consent');
  }
  if (kind === 'consent') { await act('details', { consent: true }, null, V.tier === 'plus' && !V.paid ? 'billing' : 'done'); return; }
  if (kind === 'billing') return act('billing', { ...v, payer_type: draft.payer || V.payer_type || (V.pack_buyer ? 'company' : 'self') }, null, 'pay');
  if (kind === 'pay') return pay();
  if (kind === 'approve') return act('approve', { decision: 'approve' });
  if (kind === 'changes') return act('approve', { decision: 'changes', comment: v.comment });
}
async function pay() {
  if (busy) return; busy = true; err = ''; render();
  try {
    const o = await call('pay', {});
    if (o.dev) { V = await call('paid', { dev: true }); busy = false; step = null; return render(); }
    await loadRazorpay();
    const rz = new window.Razorpay({
      key: o.key, order_id: o.order_id, amount: o.amount, currency: 'INR', name: 'BoardRoom CXO', description: V.pack_buyer ? 'Boardroom Moves Company pack' : 'Boardroom Moves Plus feature',
      prefill: { name: o.name || '', email: o.email || '', contact: o.phone || '' }, theme: { color: '#1A362D' },
      handler: async resp => { busy = true; render(); try { V = await call('paid', resp); step = null; } catch (e) { err = e.message; } busy = false; render(); },
      modal: { ondismiss: () => { busy = false; render(); } }
    });
    rz.on('payment.failed', r => { err = (r.error && r.error.description) || 'The payment did not go through. Try again.'; busy = false; render(); });
    rz.open();
  } catch (e) { err = e.message; busy = false; render(); }
}
function loadRazorpay() {
  return window.Razorpay ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement('script'); s.src = 'https://checkout.razorpay.com/v1/checkout.js'; s.onload = ok; s.onerror = () => no(new Error('The payment window could not load. Check your connection and try again.')); document.head.appendChild(s); });
}

  catch (e) { app.innerHTML = `<h1>We could not open your feature</h1><p class="lead">${esc(e.message)}</p>`; }
})();
