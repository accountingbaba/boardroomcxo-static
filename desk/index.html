<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Moves Desk | BoardRoom CXO</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/images/favicon.png" type="image/png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Open+Sans:wght@700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#F7F6F2;--bg-alt:#EFEDE7;--surface:#FFFFFF;--ink:#0F1110;--ink-2:#55584F;--emerald:#172633;--emerald-2:#22384A;--mint:#E4EAF0;--gold:#D4A860;--gold-soft:#F6ECD9;--line:#D9D6CF;--bad:#9B2C1F;--bad-soft:#F6E4DF;
--display:'Bodoni Moda','Times New Roman',serif;--body:'Manrope',system-ui,sans-serif;--mono:'Space Mono',ui-monospace,monospace}
*,*::before,*::after{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--body);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
a{color:inherit}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--emerald);color:var(--bg);display:flex;align-items:center;gap:18px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}.brand img{height:38px;width:auto;display:block}.brand span{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-left:8px;font-weight:400}
.tabs{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs a{padding:18px 12px 16px;text-decoration:none;font-weight:600;font-size:13.5px;color:#B9C4CE;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--bg);border-bottom-color:var(--gold)}
.tabs a .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--gold);color:var(--emerald);font-size:11px;text-align:center}
.me .alldesks{color:var(--gold);margin-right:14px;font-weight:600;text-decoration:none;border:1px solid rgba(212,168,96,.5);padding:5px 10px;border-radius:3px}
.me{font-size:12.5px;color:#B9C4CE;white-space:nowrap}.me button{background:none;border:0;color:var(--gold);cursor:pointer;text-decoration:underline;padding:0 0 0 8px}
main{max-width:1180px;margin:0 auto;padding:26px max(16px,env(safe-area-inset-right)) 80px max(16px,env(safe-area-inset-left))}
h1{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.1;margin:0}
h2{font-size:12px;font-family:var(--mono);letter-spacing:.16em;text-transform:uppercase;font-weight:400;color:var(--ink-2);margin:28px 0 10px}
h3{font-size:15px;margin:0 0 8px}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.sub{color:var(--ink-2);margin:4px 0 0}
.btn{appearance:none;border:1px solid var(--emerald);background:var(--emerald);color:var(--bg);font-weight:600;font-size:13px;padding:8px 14px;cursor:pointer;border-radius:3px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;line-height:1.3}
.btn:hover{background:var(--emerald-2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.g{background:var(--surface);color:var(--ink);border-color:var(--line)}.btn.g:hover{border-color:var(--ink)}
.btn.s{padding:5px 10px;font-size:12.5px}.btn.bad{background:var(--surface);color:var(--bad);border-color:#E3B9AE}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 11px;border-radius:14px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--ink-2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--bg-alt);color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.tag.plus{background:var(--gold-soft);color:#7A5512}.tag.pick{background:#E8E3F4;color:#4B3A80}.tag.pack{background:#E1EAF4;color:#24476E}.tag.free{background:var(--mint);color:var(--emerald)}
.tag.over{background:var(--bad-soft);color:var(--bad)}.tag.live{background:var(--emerald);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.tasks{display:grid;gap:8px}
.task{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:12px 14px}
.task .t{font-weight:700}.task .d{color:var(--ink-2);font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.task .b{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.task.done{opacity:.45}
.who{font-size:11.5px;color:var(--ink-2);margin-top:3px}
.empty{padding:28px;text-align:center;color:var(--ink-2)}
table{width:100%;border-collapse:collapse;background:var(--surface)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg-alt);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#FAF9F6}
.num{font-family:var(--mono);font-size:13px;text-align:right;white-space:nowrap}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.stat div{background:var(--surface);border:1px solid var(--line);padding:14px 16px;border-radius:4px}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:500;line-height:1.1}.stat span{font-size:12px;color:var(--ink-2)}
label.f{display:block;margin:0 0 12px}label.f>span{display:block;font-size:12px;font-weight:700;margin-bottom:4px;color:var(--ink-2)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=url],select,textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:8px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--emerald);box-shadow:0 0 0 1px var(--emerald)}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.err{background:var(--bad-soft);color:var(--bad);padding:9px 12px;border-radius:3px;margin:0 0 12px;font-size:13.5px}
.note{background:var(--gold-soft);padding:10px 12px;border-radius:3px;font-size:13.5px;margin:0 0 12px}
.ok{background:var(--mint);color:var(--emerald);padding:10px 12px;border-radius:3px;font-size:13.5px;margin:0 0 12px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(15,17,16,.35);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:31;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.12);padding:0 0 60px}
.drawer.wide{width:min(1240px,100%)}
.dh{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 20px 14px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;z-index:2}
.dh h1{font-size:24px}.dh .x{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--ink-2);padding:0 4px}
.db{padding:6px 20px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin:12px 0}
.sec>h3{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 14px}
.cl li{font-size:13px;padding-left:22px;position:relative}.cl li::before{content:'';position:absolute;left:0;top:3px;width:13px;height:13px;border:1px solid var(--line);border-radius:2px}
.cl li.y::before{background:var(--emerald);border-color:var(--emerald)}.cl li.y::after{content:'';position:absolute;left:4px;top:5px;width:4px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.kv{display:grid;grid-template-columns:140px minmax(0,1fr);gap:4px 12px;font-size:13.5px}.kv dt{color:var(--ink-2)}.kv dd{margin:0;word-break:break-word}
.ev{list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--ink-2)}.ev li{padding:4px 0;border-bottom:1px dashed var(--line)}.ev b{color:var(--ink);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ans{font-size:13.5px;margin:0 0 10px}.ans b{display:block;font-size:12px;color:var(--ink-2)}
.thumbs{display:flex;flex-wrap:wrap;gap:10px}.thumbs figure{margin:0;font-size:11.5px;color:var(--ink-2)}.thumbs img{display:block;height:120px;border:1px solid var(--line)}
.ver{font-size:11.5px;color:var(--ink-2);font-weight:400}
/* image builder */
.ib{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}
.ib canvas{width:100%;height:auto;border:1px solid var(--line);display:block;background:#222}
.ibp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.ibp figure{margin:0}.ibp figcaption{font-size:11.5px;color:var(--ink-2);margin-top:4px}
input[type=range]{width:100%;accent-color:var(--emerald)}
/* sign in */
.signin{max-width:400px;margin:10vh auto 0;padding:0 16px}
.signin .card{padding:28px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:4px;font-weight:600;z-index:60;font-size:13.5px;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.cal{display:grid;gap:8px}.cal .day{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:12px 14px;align-items:start}
.cal .day b{display:block}.cal .day .k{font-size:11.5px;color:var(--ink-2)}
@media(max-width:760px){.task{grid-template-columns:1fr}.task .b{justify-content:flex-start}.g2,.g3{grid-template-columns:1fr}.ib{grid-template-columns:1fr}.ibp{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.kv dt{margin-top:6px}.cal .day{grid-template-columns:1fr}.me{display:none}}

/* ===== Team Desk design (Oct 2026): the same shell as the other companies =====
   Dark ink sidebar, slate work area, Plus Jakarta Sans. Moves keeps the BoardRoom navy for actions and gold as its accent. */
:root{--bg:#F4F6F9;--bg-alt:#EEF1F5;--surface:#FFFFFF;--ink:#0F172A;--ink-2:#5B6576;--emerald:#172633;--emerald-2:#22384A;--mint:#E8EDF2;--gold:#D4A860;--gold-soft:#F8EEDB;--line:#E1E5EB;
  --display:'Plus Jakarta Sans',system-ui,sans-serif;--body:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --side:#0E1726;--side-2:#172235;--side-text:#A9B4C6;--side-strong:#F3F5F9;--shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04)}
body{font-size:14.5px;letter-spacing:-.003em}
h1{font-weight:700;font-size:24px;letter-spacing:-.02em}
h2{font-family:var(--body);font-size:12px;letter-spacing:.06em;font-weight:700;color:var(--ink-2)}
.card,.stat div,.tw,.sec{box-shadow:var(--shadow);border-color:var(--line);border-radius:12px}.tw{border-radius:12px}
.btn{border-radius:8px}.chip{border-radius:999px}.tag{border-radius:999px}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=number],input[type=url],select,textarea{border-radius:8px}
.stat b{font-family:var(--body);font-weight:700}
.ctx{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin:-6px 0 14px}
.copick{position:relative}
.cobtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:var(--shadow)}
.cobtn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.cobtn small{color:var(--ink-2);font-weight:500}
.comenu{position:absolute;right:0;top:calc(100% + 6px);z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,23,42,.14);padding:6px;min-width:260px}
.comenu a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px}
.comenu a:hover{background:var(--bg-alt)}.comenu a.on{background:var(--gold-soft)}
.comenu i{width:10px;height:10px;border-radius:50%;flex:none}
@media(min-width:1024px){
  html.td body{padding-left:232px}
  html.td .top{position:fixed;left:0;top:0;bottom:0;width:232px;flex-direction:column;align-items:stretch;gap:18px;padding:20px 12px;min-height:0;flex-wrap:nowrap;background:var(--side)}
  html.td .brand{flex-direction:column;align-items:flex-start;gap:2px;padding:4px 10px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
  html.td .tabs{flex-direction:column;flex:0 0 auto;overflow:visible;gap:2px}
  html.td .tabs a{padding:10px 12px;border-bottom:0;border-radius:8px;color:var(--side-text);display:flex;align-items:center;justify-content:space-between}
  html.td .tabs a:hover{background:var(--side-2);color:var(--side-strong)}
  html.td .tabs a.on{background:var(--side-2);color:var(--side-strong);box-shadow:inset 3px 0 0 var(--gold)}
  html.td .me{margin-top:auto;white-space:normal;border-top:1px solid rgba(255,255,255,.07);padding:14px 10px 0;display:flex;flex-direction:column;gap:8px;color:var(--side-text)}
  html.td .me a,html.td .me button{color:var(--side-strong);text-decoration:none;padding:0;text-align:left;opacity:.85}html.td .me a:hover,html.td .me button:hover{opacity:1;text-decoration:underline}
  html.td main{max-width:1240px;padding-top:28px}
  html.td .drawer{width:min(780px,calc(100% - 232px))}
}
html.td .top{background:var(--side)}
html.td .brand .brandrow{display:flex;align-items:center;gap:10px;color:var(--side-strong);font-weight:700;font-size:16px}
html.td .brand .mark{width:30px;height:30px;border-radius:9px;background:var(--gold);color:#0E1726;display:grid;place-items:center;font-size:13px;font-weight:700}
html.td .brand small{color:var(--side-text);font-size:12px;font-weight:500;padding-left:40px;font-family:var(--body);letter-spacing:0;text-transform:none}
html.td .brand img{display:none}
html.td .brand span.brandrow,html.td .brand span.mark{font-family:var(--body);text-transform:none;letter-spacing:0;margin-left:0}
html.td .brand span.brandrow{font-size:16px;color:var(--side-strong)}html.td .brand span.mark{font-size:13px;color:#0E1726}
html.td .ctx{max-width:1240px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
html.td main{padding-top:6px}
@media(max-width:1023px){html.td .ctx{justify-content:flex-start}}
.drawer{box-shadow:-24px 0 48px rgba(15,23,42,.18)}
</style>
</head>
<body>
<header class="top" id="top" hidden>
  <div class="brand"><img src="/images/logo-boardroomcxo-transparent.png" alt="BoardRoom CXO" width="87" height="38"><span class="brandrow" hidden><span class="mark" aria-hidden="true">TD</span>Team Desk</span><small hidden>Boardroom Moves</small></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="me" id="me"></div>
</header>
<div class="ctx" id="ctx" hidden></div>
<main id="view"><p class="sub"><span class="spin"></span> Loading…</p></main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"></aside>
<div class="toast" id="toast" hidden></div>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rs = n => 'Rs ' + Number(n || 0).toLocaleString('en-IN');
const first = n => String(n || '').trim().split(/\s+/)[0] || '';
const day = d => d ? new Date(String(d).slice(0, 10) + 'T00:00:00Z').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'UTC' }) : '';
const when = iso => iso ? new Date(iso).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Kolkata' }) : '';
let ME = null, TODAY = null, mineOnly = true;

// ── Messages the team sends by hand on LinkedIn (from the Moves playbook v5, wording agreed 19 Oct 2026) ──
// On the team desk (desk.accountingbaba.com) this page is served at /moves/ next to the other companies.
const ON_TEAM_DESK = /\/moves\/?$/.test(location.pathname);
const TEAM_HOME = location.pathname.replace(/moves\/?$/, ''); // the team desk's company list, e.g. /bd/
let TPL = {}; // the LinkedIn messages, loaded from Settings so admins can edit them
const fill = (k, p, link) => String(TPL[k] || '').replace(/{{First Name}}/g, first(p.name)).replace(/{{Company}}/g, p.company || 'your new company').replace(/{{Link}}/g, link || '');
const STAGES = { ready: 'To send', sent: 'Request sent', connected: 'Connected', replied: 'Replied', linked: 'Link sent', noreply: 'No reply', declined: 'Declined' };
const STATUS = { invited: 'Link sent', details: 'Filling details', payment: 'Waiting for payment', ready: 'To draft', approval: 'With leader', changes: 'Changes asked', approved: 'Approved', scheduled: 'Scheduled', live: 'Live', removed: 'Removed', cancelled: 'Cancelled', active: 'Pack active' };
const TIER = { free: 'Free', plus: 'Plus', pick: 'Pick', pack: 'Pack' };
const tierTag = t => t ? `<span class="tag ${t}">${TIER[t] || t}</span>` : '<span class="tag">Not chosen</span>';

async function api(path, body, opt = {}) {
  const o = { method: body !== undefined || opt.raw ? 'POST' : 'GET', headers: {} };
  if (opt.raw) { o.body = opt.raw; o.headers['Content-Type'] = opt.raw.type || 'application/octet-stream'; }
  else if (body !== undefined) { o.body = JSON.stringify(body); o.headers['Content-Type'] = 'application/json'; }
  const r = await fetch('/api/moves/' + path, o);
  const d = await r.json().catch(() => ({ error: 'The server sent an unexpected reply.' }));
  if (r.status === 401 && path.startsWith('team')) { ME = null; signin(); throw new Error('Sign in again.'); }
  if (!r.ok) throw new Error(d.error || 'Something went wrong.');
  return d;
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
async function copy(text, label) {
  if (!text) return toast('Nothing to copy here. Refresh the page and try again.');
  try { await navigator.clipboard.writeText(text); toast((label || 'Text') + ' copied'); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast((label || 'Text') + ' copied'); }
}
const waUrl = (phone, text) => { const d = String(phone || '').replace(/\D/g, ''); return d ? `https://wa.me/${d.length === 10 ? '91' + d : d}?text=${encodeURIComponent(text)}` : ''; };
// Buttons carry their action in data attributes; one handler for the whole page.
const B = (label, attrs, cls) => `<button type="button" class="btn ${cls || ''}" ${Object.entries(attrs).map(([k, v]) => `data-${k}="${esc(v)}"`).join(' ')}>${label}</button>`;
const COPY = new Map(); let copyN = 0;
const copyBtn = (text, label, cls) => { const k = 'c' + (++copyN); COPY.set(k, [text, label]); return B(label ? 'Copy ' + label.toLowerCase() : 'Copy', { copy: k }, cls || 'g s'); };

// ── Sign in ──────────────────────────────────────────────────────────────────
function signin(sentTo, err, devCode) {
  $('#top').hidden = true; closeDrawer();
  $('#view').innerHTML = `<div class="signin"><div class="card"><h1 style="margin-bottom:6px">Moves desk</h1><p class="sub" style="margin-bottom:20px">${sentTo ? `We sent a 6-digit code to <b>${esc(sentTo)}</b>.` : 'Sign in with your work email. We email you a code.'}</p>
    ${err ? `<div class="err">${esc(err)}</div>` : ''}${devCode ? `<div class="note">Test mode code: <b>${esc(devCode)}</b></div>` : ''}
    <form id="sf">${sentTo ? `<label class="f"><span>Code</span><input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required autofocus></label>`
      : `<label class="f"><span>Email</span><input type="email" name="email" autocomplete="email" required autofocus></label>`}

// Paste a LinkedIn link and the desk fills name, role and company from the public search result.
function liFill(form) {
  const inp = form.querySelector('[data-lifill]'), note = form.querySelector('[data-linote]'), btn = form.querySelector('[data-lifetch]');
  let last = '';
  const run = async () => {
    const url = inp.value.trim(); if (!/linkedin\.com\/in\//i.test(url) || url === last) return; last = url;
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span>'; note.textContent = 'Looking up the profile…';
    try {
      const r = await api('team/lookup', { url });
      inp.value = r.linkedin;
      const set = (k, v) => { const f = form.querySelector(`[name=${k}]`); if (f && v && !f.value.trim()) f.value = v; };
      set('name', r.name); set('role_title', r.role_title); set('company', r.company);
      note.textContent = r.source === 'search' ? `Filled from the public LinkedIn result${r.headline ? ' (headline: ' + r.headline + ')' : ''}. Check the role and company before saving.`
        : 'Only the name could be read from the link. Add the role and company.';
    } catch (x) { note.textContent = x.message; last = ''; }
    btn.disabled = false; btn.textContent = 'Fill';
  };
  inp.addEventListener('paste', () => setTimeout(run, 50));
  inp.addEventListener('change', run);
  btn.onclick = () => { last = ''; run(); };
}

const loadImg = src => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error('Could not load ' + src)); i.src = src; });

function draw() { Object.keys(SIZES).forEach(k => paint($('#cv-' + k), k)); }
function paint(cv, kind) {
  const W = cv.width, H = cv.height, g = cv.getContext('2d'), s = kind === 'website' ? 0.72 : 1;
  g.fillStyle = '#1b1d1c'; g.fillRect(0, 0, W, H);
  if (IB.photo) { // cover crop, then zoom and pan within the spare area
    const p = IB.photo, sc = Math.max(W / p.width, H / p.height) * IB.zoom, pw = p.width * sc, ph = p.height * sc;
    const yb = kind === 'website' ? Math.max(-1, IB.y - 0.7) : IB.y; // the wide crop keeps the face: start near the top of the photo
    g.drawImage(p, (W - pw) / 2 + IB.x * (pw - W) / 2, (H - ph) / 2 + yb * (ph - H) / 2, pw, ph);
  }
  // dark fade behind the text at the bottom
  const fadeTop = H * (kind === 'website' ? 0.38 : 0.55), gr = g.createLinearGradient(0, fadeTop, 0, H);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.55, 'rgba(0,0,0,0.72)'); gr.addColorStop(1, 'rgba(0,0,0,0.92)');
  g.fillStyle = gr; g.fillRect(0, fadeTop, W, H - fadeTop);
  // top-left band: "Boardroom Moves #NN"
  const bandY = 48 * s, bandH = 52 * s, label = 'Boardroom Moves ', num = IB.no ? '#' + IB.no : '';
  g.font = `700 ${Math.round(25 * s)}px "Open Sans"`; const lw = g.measureText(label).width, nw = g.measureText(num).width;
  g.fillStyle = 'rgba(30,30,30,0.62)'; g.fillRect(0, bandY, 40 * s + lw + nw + 150 * s, bandH);
  g.textBaseline = 'middle'; g.fillStyle = '#fff'; g.fillText(label, 40 * s, bandY + bandH / 2 + 1); g.fillStyle = YELLOW; g.fillText(num, 40 * s + lw, bandY + bandH / 2 + 1);
  // top-right logo square
  const ls = 158 * s; if (LOGO) g.drawImage(LOGO, W - ls - 56 * s, 48 * s, ls, ls);
  // bottom text: name and company in yellow, the line in white, wrapped and centred
  const fs = Math.round((kind === 'website' ? 34 : 44)), lh = fs * 1.22, maxW = W - (kind === 'website' ? 120 : 90);
  g.font = `800 ${fs}px "Open Sans"`; g.textBaseline = 'alphabetic';
  const words = [].concat(...[[IB.name, YELLOW], [IB.line, '#fff'], [IB.company, YELLOW]].map(([t, c]) => String(t || '').split(/\s+/).filter(Boolean).map(w => [w, c])));
  const lines = []; let cur = [], cw = 0; const sp = g.measureText(' ').width;
  for (const w of words) { const ww = g.measureText(w[0]).width; if (cur.length && cw + sp + ww > maxW) { lines.push([cur, cw]); cur = []; cw = 0; } cw += (cur.length ? sp : 0) + ww; cur.push([w[0], w[1], ww]); }
  if (cur.length) lines.push([cur, cw]);
  const bottom = H - (kind === 'website' ? 38 : 52); let y = bottom - (lines.length - 1) * lh;
  g.shadowColor = 'rgba(0,0,0,0.35)'; g.shadowBlur = 6;
  for (const [ws, w] of lines) { let x = (W - w) / 2; for (const [t, c, tw] of ws) { g.fillStyle = c; g.fillText(t, x, y); x += tw + sp; } y += lh; }
  g.shadowBlur = 0;
}

  <h2>Team</h2><p class="sub" style="margin:-4px 0 10px">The team is whoever is on the <a href="https://accountingbaba.com/portal/#/team/staff" target="_blank" rel="noopener">Accounting Baba portal Team page</a>: add or remove people there and it shows here. Here you choose each person's companies. A Manager sees every company and the Team activity page.</p><div class="tw"><table><thead><tr><th>Email</th><th>Name</th><th>Role</th><th>Companies</th><th>Active</th></tr></thead><tbody>
    ${d.admins.map(a => `<tr><td>${esc(a)}</td><td></td><td>Admin (owner)</td><td>All</td><td>Yes</td></tr>`).join('')}
    ${d.staff.filter(x => !d.admins.includes(x.email)).map(x => `<tr><td>${esc(x.email)}</td><td>${esc(x.name || '')}</td><td>${x.role === 'admin' ? 'Admin' : `<select data-rolefor="${esc(x.email)}" style="width:auto;padding:4px 6px"><option value="member" ${x.role !== 'manager' ? 'selected' : ''}>Team</option><option value="manager" ${x.role === 'manager' ? 'selected' : ''}>Manager (sees all)</option></select>`}</td><td>${x.role === 'admin' || x.role === 'manager' ? 'All' : DESKS.map(([k, v]) => `<label style="white-space:nowrap;margin-right:8px;font-size:12.5px"><input type="checkbox" data-deskfor="${esc(x.email)}" data-name="${esc(x.name || '')}" value="${k}" ${String(x.desks || '').split(',').includes(k) ? 'checked' : ''}> ${v}</label>`).join('')}</td><td>${x.active ? 'Yes' : 'No (removed on the portal)'}</td></tr>`).join('')}</tbody></table></div>
  <h2>Who does what</h2><form id="sf2" class="card" style="padding:14px"><div class="g2">
    ${Object.entries({ outreach: 'Outreach and publishing', content: 'Replies and drafting', approvals: 'Approvals', checkins: 'Check-ins' }).map(([k, v]) => `<label class="f"><span>${v}</span><input type="email" name="duty_${k}" value="${esc(s.duties[k] || '')}"></label>`).join('')}</div>
  <h2 style="margin-top:6px">Prices and rules</h2><div class="g3">
    <label class="f"><span>Plus price (Rs, before GST)</span><input type="number" name="plus" value="${s.prices.plus}"></label><label class="f"><span>Company pack (Rs, before GST)</span><input type="number" name="pack" value="${s.prices.pack}"></label><label class="f"><span>Plus offered from</span><input type="date" name="price_from" value="${esc(s.price_from)}"></label>
    <label class="f"><span>Connection requests a day</span><input type="number" name="daily_requests" value="${s.daily_requests}"></label><label class="f"><span>Paid features Ketul checks first</span><input type="number" name="internal_approval_first" value="${s.internal_approval_first}"></label><label class="f"><span>Next Boardroom Moves #</span><input type="number" name="moves_next" value="${s.moves_next}"></label>
    <label class="f"><span>SAC code for invoices</span><input type="text" name="books_sac" value="${esc(s.books_sac)}" placeholder="From the CA"></label><label class="f"><span>WhatsApp community size</span><input type="text" name="whatsapp_community" value="${esc(s.whatsapp_community)}"></label></div>
  <button class="btn" type="submit">Save settings</button></form>
  <h2>LinkedIn messages</h2><form id="tpf" class="card" style="padding:14px"><p class="sub" style="margin:0 0 12px">{{First Name}}, {{Company}} and {{Link}} are filled in for each person.</p>
    ${[['note', 'Connection request note'], ['msg1', 'Message 1, after they accept'], ['nudge', 'Nudge'], ['link', 'Sending their personal link'], ['wa_ask', 'Asking for WhatsApp'], ['ci30', 'Day-30 check-in'], ['ci60', 'Day-60 check-in']]
      .map(([k, v]) => `<label class="f"><span>${v}</span><textarea name="${k}" style="min-height:${k === 'note' ? 70 : 100}px">${esc((s.templates || {})[k] || '')}</textarea>${k === 'note' ? `<small class="sub" data-notelen></small>` : ''}</label>`).join('')}
    <button class="btn" type="submit">Save messages</button></form>`;
  const nl = document.querySelector('[data-notelen]'), nt = document.querySelector('#tpf textarea[name=note]');
  const showLen = () => { nl.textContent = nt.value.length + ' characters (LinkedIn allows 300 in a connection note)'; nl.style.color = nt.value.length > 300 ? 'var(--bad)' : ''; };
  nt.oninput = showLen; showLen();
  $('#tpf').onsubmit = async e => { e.preventDefault(); const t = Object.fromEntries(new FormData(e.target)); try { await api('team/settings', { settings: { templates: t } }); TPL = t; toast('Messages saved'); } catch (x) { toast(x.message); } };
  document.querySelectorAll('[data-rolefor]').forEach(sel => sel.onchange = async () => {
    const row = d.staff.find(x => x.email === sel.dataset.rolefor);
    try { await api('team/settings', { staff: { email: row.email, role: sel.value } }); toast('Saved'); vSettings(); } catch (x) { toast(x.message); }
  });
  document.querySelectorAll('[data-deskfor]').forEach(cb => cb.onchange = async () => {
    const em = cb.dataset.deskfor, boxes = [...document.querySelectorAll(`[data-deskfor="${CSS.escape(em)}"]`)];
    const row = d.staff.find(x => x.email === em);
    try { await api('team/settings', { staff: { email: em, name: row.name || '', role: row.role, active: Boolean(row.active), desks: boxes.filter(b => b.checked).map(b => b.value) } }); toast('Saved'); } catch (x) { toast(x.message); }
  });
  $('#sf2').onsubmit = async e => {
    e.preventDefault(); const v = Object.fromEntries(new FormData(e.target));
    const settings = { duties: { outreach: v.duty_outreach, content: v.duty_content, approvals: v.duty_approvals, checkins: v.duty_checkins },
      prices: { ...s.prices, plus: Number(v.plus), pack: Number(v.pack) }, price_from: v.price_from, daily_requests: Number(v.daily_requests),
      internal_approval_first: Number(v.internal_approval_first), moves_next: Number(v.moves_next), books_sac: v.books_sac.trim(), whatsapp_community: v.whatsapp_community };
    try { await api('team/settings', { settings }); toast('Settings saved'); } catch (x) { toast(x.message); }
  };
}

// ── Drawer and clicks ────────────────────────────────────────────────────────
function drawer(html, hash, wide) {
  $('#drawer').classList.toggle('wide', Boolean(wide));
  $('#drawer').innerHTML = html; $('#drawer').hidden = false; $('#scrim').hidden = false; $('#drawer').scrollTop = 0;
  if (hash && location.hash.slice(1) !== hash) history.replaceState(null, '', '#' + hash);
  document.body.style.overflow = 'hidden';
}
function closeDrawer() {
  $('#drawer').hidden = true; $('#scrim').hidden = true; document.body.style.overflow = '';
  const v = location.hash.slice(1).split(':')[0]; if (location.hash.includes(':')) history.replaceState(null, '', '#' + v);
}
function refreshBehind() { const v = (location.hash.slice(1) || 'today').split(':')[0]; ({ today: vToday, leads: vLeads, orders: vOrders })[v]?.().catch(() => {}); }
$('#scrim').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#drawer').hidden) closeDrawer(); });
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-copy],[data-close],[data-lead],[data-openlead],[data-openorder],[data-oact],[data-mine],[data-stage],[data-ofilter],[data-addlead],[data-newfeature],[data-newpack],[data-builder],[data-ibsave],[data-staffon]');
  if (!el) return;
  const ds = el.dataset;
  if (ds.copy) { const [t, l] = COPY.get(ds.copy) || ['', '']; return copy(t, l); }
  if ('close' in ds) return closeDrawer();
  if (ds.lead) {
    if (ds.stay) return leadAct(ds.lead, ds.act, null, true);
    el.closest('.task')?.classList.add('done'); return leadAct(ds.lead, ds.act);
  }
  if (ds.openlead) return openLead(ds.openlead).catch(x => toast(x.message));
  if (ds.oact) {
    if (ds.confirm && !el.dataset.armed) { el.dataset.armed = 1; el.textContent = 'Click again to confirm'; toast(ds.confirm); return; }
    if (ds.order) { try { await api(`team/orders/${ds.order}/action`, { act: ds.oact }); el.closest('.task')?.classList.add('done'); toast('Saved'); } catch (x) { toast(x.message); } return; }
    return orderAct(ds.oact, ds.kind ? { kind: ds.kind } : {});
  }
  if (ds.openorder) return openOrder(ds.openorder).catch(x => toast(x.message));
  if (ds.mine) { mineOnly = ds.mine === '1'; return vToday(); }
  if (ds.stage !== undefined) { leadStage = ds.stage; return vLeads(); }
  if (ds.ofilter) { orderFilter = ds.ofilter; return vOrders(); }
  if (ds.addlead) return addLead();
  if (ds.newfeature) return newFeature();
  if (ds.newpack) return newPack();
  if (ds.builder) return builder().catch(x => toast(x.message));
  if (ds.ibsave) return saveImages();
  if (ds.staffon) { try { await api('team/settings', { staff: { email: ds.staffon, name: ds.name, role: ds.role, active: ds.active === '1' } }); vSettings(); } catch (x) { toast(x.message); } }
});
boot();
})();
</script>
